    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #f7f9fa;
            --primary-color: #ff4757;
            --secondary-color: #2ed573;
            --accent-color: #ffa502;
            --dark-color: #2f3542;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 25px;
        }
        .setup-section,
        .game-section {
            display: none;
        }
        .active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-accent {
            background-color: var(--accent-color);
        }
        .song-pool {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .song-card {
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            background: #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .song-card .badge {
            font-size: 11px;
            background: #ffeaa7;
            color: #d63031;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
        }
        .match-block {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .player-input-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-row {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            text-align: center;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .result-table th,
        .result-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .result-table th {
            background-color: #f1f2f6;
        }
        .rank-1 {
            background-color: #fff200;
            font-weight: bold;
        }
        .song-history {
            text-align: left;
            font-size: 12px;
            color: #555;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 6px;
            margin-top: 5px;
            font-weight: normal;
        }
        
        /* 【新規】ライフ点滅アニメーション用のCSS */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.1; }
            100% { opacity: 1; }
        }
        .life-blink {
            animation: blink 0.6s infinite;
        }
        /* ライフゲージが減るときに、アニメーションでシュッと滑らかに縮むようにする設定 */
        .match-block + div div {
            transition: width 0.3s ease;
　　  　}
    </style>

<div class="container">
    <h1>太鼓の達人 ★10ランダム選曲</h1>
    <div id="setupSection" class="setup-section active">
        <div class="form-group">
            <label>1. プレイ人数 (1~4人)</label>
            <select id="playerCount" onchange="updatePlayerInputs()">
                <option value="1">1人</option>
                <option value="2" selected>2人</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
            </select>
        </div>
        <div id="playerNamesContainer"></div>
        
        <!-- 【修正】曲数制限は「勝敗ルール」によって変化させるため、枠を設けておきます -->
        <div class="form-group" id="songCountFormGroup">
            <label>2. 1人あたりのプレイ曲数(1~7曲)</label>
            <select id="songCount">
                <option value="1">1曲</option>
                <option value="2">2曲</option>
                <option value="3" selected>3曲</option>
                <option value="4">4曲</option>
                <option value="5">5曲</option>
                <option value="6">6曲</option>
                <option value="7">7曲</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>3. 勝敗の判定方法</label>
            <select id="scoringRule" onchange="toggleScoringRuleOptions()">
                <option value="ratio">1. 良の割合(全体の割合で順位を決定)</option>
                <option value="points">2. 可・不可の数(カスタム減点方式)</option>
                <option value="bomb">3. 爆弾ルール(ライフサバイバル方式)</option>
            </select>
        </div>
        
        <!-- 可・不可のカスタム減点ポイント設定枠 -->
        <div id="penaltyPointsContainer" class="grid-2" style="display: none; margin-bottom: 20px;">
            <div>
                <label style="font-size:12px;">可の減点ポイント</label>
                <input type="number" id="customKaPoint" value="1" min="0">
            </div>
            <div>
                <label style="font-size:12px;">不可の減点ポイント</label>
                <input type="number" id="customFukaPoint" value="2" min="0">
            </div>
        </div>

        <!-- 【新規】爆弾ルール専用のライフ・シークレット設定枠 -->
        <div id="bombRuleContainer" style="display: none; background: #fff3f3; padding: 15px; border-radius: 8px; border: 1px solid #ffcccc; margin-bottom: 20px;">
            <div class="form-group">
                <label style="font-size:14px; color:#d63031;">💣 爆弾モード設定</label>
                <select id="bombMode" onchange="toggleBombSecretMode()">
                    <option value="normal">通常爆弾 (ライフ指定)</option>
                    <option value="secret">シークレット爆弾 (ライフが30～100のランダム)</option>
                </select>
            </div>
            <div id="bombInitialLifeGroup" class="form-group">
                <label style="font-size:12px;">初期ライフ数</label>
                <input type="number" id="bombInitialLife" value="100" min="1">
            </div>
            <div class="grid-2">
                <div>
                    <label style="font-size:12px;">可1つによるダメージ</label>
                    <input type="number" id="bombKaDamage" value="1" min="0">
                </div>
                <div>
                    <label style="font-size:12px;">不可1つによるダメージ</label>
                    <input type="number" id="bombFukaDamage" value="2" min="0">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>4. ランダム選曲の方法</label>
            <select id="selectionMethod">
                <option value="normal">1. 通常 (1曲ずつ選曲・即リザルト)</option>
                <option value="draft">2. 選択 (1.5倍を全抽選し、先行から交互に選ぶ)</option>
            </select>
        </div>
        <div class="form-group">
            <label>5. 対象にする難易度帯（複数選択可）</label>
            <div style="margin-bottom: 10px;">
                <button type="button" class="btn" onclick="checkAllRanks(true)" style="margin-top:0; margin-right:10px; padding:6px 12px; font-size:12px; background-color:#747d8c; width:auto;">すべてチェック</button>
                <button type="button" class="btn" onclick="checkAllRanks(false)" style="margin-top:0; padding:6px 12px; font-size:12px; background-color:#747d8c; width:auto;">すべて外す</button>
            </div>
            <div id="difficultyCheckboxContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; background: #f1f2f6; padding: 15px; border-radius: 8px;"></div>
        </div>
        <button class="btn" onclick="startTournament()">設定を確定して試合開始！</button>
    </div>
    <div id="gameSection" class="game-section">
        <h2 id="gameStatusTitle" style="text-align:center;"></h2>
        <div id="selectionArea"></div>
        <div id="matchPlayArea"></div>
        <div class="grid-2" style="margin-top: 15px;">
            <button id="cancelBtn" class="btn btn-accent" onclick="abortTournament()" style="background-color:#747d8c; margin-top:0;">試合を中断する</button>
            <button id="actionBtn" class="btn" onclick="handleGameAction()" style="margin-top:0;">次のステップへ</button>
        </div>
    </div>
</div>

window.onload = function () {
    const container = document.getElementById("difficultyCheckboxContainer");
    container.innerHTML = "";
    [...DIFF_RANKS].reverse().forEach((rank) => {
        const count = SONG_DATABASE.filter(s => s.rank === rank || s.rank.replace("地力", "") === rank).length;
        container.innerHTML += `
            <label style="display: inline-flex; align-items: center; font-weight: normal; cursor: pointer; font-size: 14px;">
                <input type="checkbox" name="diffCheck" value="${rank}" style="width: auto; margin-right: 6px;" checked>
                ${rank} (${count}曲)
            </label>
        `;
    });
    updatePlayerInputs();
};

window.checkAllRanks = function(status) {
    const checkboxes = document.getElementsByName("diffCheck");
    checkboxes.forEach(cb => { cb.checked = status; });
};

function updatePlayerInputs() {
    const count = parseInt(document.getElementById("playerCount").value);
    const container = document.getElementById("playerNamesContainer");
    container.innerHTML = `
        <label>プレイヤー名と順番設定</label>
        <button type="button" class="btn" onclick="randomizeOrder()" style="margin-top:0; margin-bottom:10px; padding:6px 12px; font-size:12px; background-color:var(--accent-color); width:auto;">順番をランダムに決める</button>
    `;
    for (let i = 1; i <= count; i++) {
        let options = "";
        for (let k = 1; k <= count; k++) {
            options += `<option value="${k}" ${k === i ? 'selected' : ''}>${k}番手</option>`;
        }
        container.innerHTML += `
        <div class="form-group grid-2" style="margin-bottom:8px;">
            <input type="text" id="pName${i}" value="Player ${i}">
            <select id="pOrder${i}">${options}</select>
        </div>`;
    }
}

function randomizeOrder() {
    const count = parseInt(document.getElementById("playerCount").value);
    let orders = Array.from({length: count}, (_, i) => i + 1);
    for (let i = orders.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [orders[i], orders[j]] = [orders[j], orders[i]];
    }
    for (let i = 1; i <= count; i++) {
        document.getElementById(`pOrder${i}`).value = orders[i - 1];
    }
}

function toggleScoringRuleOptions() {
    const rule = document.getElementById("scoringRule").value;
    document.getElementById("penaltyPointsContainer").style.display = (rule === "points") ? "grid" : "none";
    document.getElementById("bombRuleContainer").style.display = (rule === "bomb") ? "block" : "none";
    document.getElementById("songCountFormGroup").style.display = (rule === "bomb") ? "none" : "block";
    
    // 【新規】爆弾モードの時は「4. ランダム選曲の方法」のセレクトボックスごと非表示にする
    const selectionMethodForm = document.getElementById("selectionMethod").closest('.form-group');
    if (selectionMethodForm) {
        if (rule === "bomb") {
            selectionMethodForm.style.display = "none";
            document.getElementById("selectionMethod").value = "normal"; // 強制的に通常選曲モードにする
        } else {
            selectionMethodForm.style.display = "block";
        }
    }
}

let gameConfig = {};
let filteredSongs = [];
let drawnSongs = [];
let selectedSongs = [];

let bombMaxLife = 100;   // 初期最大ライフ

function startTournament() {
    const pCount = parseInt(document.getElementById("playerCount").value);
    let players = [];
    for (let i = 1; i <= pCount; i++) {
        players.push({
            name: document.getElementById(`pName${i}`).value,
            order: parseInt(document.getElementById(`pOrder${i}`).value),
            results: [],
            totalDamage: 0 // 爆弾ルール用の被ダメージ合計
        });
    }
    players.sort((a, b) => a.order - b.order);

    const checkboxes = document.getElementsByName("diffCheck");
    let selectedRanks = [];
    checkboxes.forEach(cb => { if (cb.checked) selectedRanks.push(cb.value); });
    
    if (selectedRanks.length === 0) {
        alert("難易度帯を最低1つは選択してください！");
        return;
    }

    filteredSongs = SONG_DATABASE.filter(song => {
        const cleanRank = song.rank.replace("地力", "");
        return selectedRanks.includes(song.rank) || selectedRanks.includes(cleanRank);
    });

    if (filteredSongs.length === 0) {
        alert("選択された難易度帯の曲がデータベースにありません。");
        return;
    }

    const scoringRule = document.getElementById("scoringRule").value;
    let songCountPerPlayer = 0;
    
    if (scoringRule === 'bomb') {
        // 爆弾ルールは曲数無制限（便宜上大きな数を設定しておき、ライフ消失で終了）
        songCountPerPlayer = 999; 
        totalSongsToPlay = 9999;
        
        const bombMode = document.getElementById("bombMode").value;
        if (bombMode === 'secret') {
            // 30〜100のランダムでライフ決定
            bombMaxLife = Math.floor(Math.random() * (100 - 30 + 1)) + 30;
        } else {
            bombMaxLife = parseInt(document.getElementById("bombInitialLife").value) || 100;
        }
        bombCurrentLife = bombMaxLife;
    } else {
        songCountPerPlayer = parseInt(document.getElementById("songCount").value);
        totalSongsToPlay = songCountPerPlayer * pCount;
    }

    gameConfig = {
        players: players,
        songCountPerPlayer: songCountPerPlayer,
        scoringRule: scoringRule,
        selectionMethod: document.getElementById("selectionMethod").value,
        bombMode: document.getElementById("scoringRule").value === 'bomb' ? document.getElementById("bombMode").value : 'normal',
        bombKaDamage: parseInt(document.getElementById("bombKaDamage").value) || 1,
        bombFukaDamage: parseInt(document.getElementById("bombFukaDamage").value) || 2
    };

    document.getElementById("setupSection").classList.remove("active");
    document.getElementById("gameSection").classList.add("active");

    if (gameConfig.selectionMethod === 'draft') {
        initDraftMode();
    } else {
        initNormalMode();
    }
}

function initDraftMode() {
    // 爆弾モードでドラフト選択の場合、とりあえず30曲プールを作る
    const poolSize = gameConfig.scoringRule === 'bomb' ? 30 : Math.ceil(totalSongsToPlay * 1.5);
    drawnSongs = [];
    let tempDb = [...filteredSongs];
    for (let i = 0; i < poolSize; i++) {
        if (tempDb.length === 0) tempDb = [...filteredSongs];
        const randIdx = Math.floor(Math.random() * tempDb.length);
        drawnSongs.push(tempDb.splice(randIdx, 1)[0]);
    }
    selectedSongs = [];
    draftPickerIndex = 0;
    renderDraftScreen();
}

function initDraftMode() {
    const poolSize = Math.ceil(totalSongsToPlay * 1.5);
    drawnSongs = [];
    let tempDb = [...filteredSongs];
    for (let i = 0; i < poolSize; i++) {
        if (tempDb.length === 0) tempDb = [...filteredSongs];
        const randIdx = Math.floor(Math.random() * tempDb.length);
        drawnSongs.push(tempDb.splice(randIdx, 1)[0]);
    }
    selectedSongs = [];
    draftPickerIndex = 0;
    renderDraftScreen();
}

function renderDraftScreen() {
    const activePlayer = gameConfig.players[draftPickerIndex];
    document.getElementById("gameStatusTitle").innerText = `【選曲フェーズ】\n${activePlayer.name}さん曲を選んでください (${selectedSongs.length + 1}/${totalSongsToPlay}曲目)`;
    
    let html = `<p style="text-align:center;">必要な合計曲数: ${totalSongsToPlay}曲 / 現在選ばれた曲数: ${selectedSongs.length}曲</p><div class="song-pool">`;
    drawnSongs.forEach((song, idx) => {
        html += `<div class="song-card" onclick="selectDraftSong(${idx})"><span class="badge">[${song.rank}]</span><br>${song.name}</div>`;
    });
    html += '</div>';
    document.getElementById("selectionArea").innerHTML = html;
    document.getElementById("matchPlayArea").innerHTML = "";
    document.getElementById("actionBtn").style.display = "none";
}

function selectDraftSong(idx) {
    const song = drawnSongs.splice(idx, 1)[0];
    selectedSongs.push(song);
    if (selectedSongs.length < totalSongsToPlay) {
        draftPickerIndex = (draftPickerIndex + 1) % gameConfig.players.length;
        renderDraftScreen();
    } else {
        currentRound = 0;
        document.getElementById("selectionArea").innerHTML = "";
        initMatchProgress();
    }
}

function initNormalMode() {
    selectedSongs = [];
    drawNextNormalSong();
}

function drawNextNormalSong() {
    // 次の曲を自動選択せず、一旦画面をリセットして「抽選する」ボタンを待つ状態にする
    initMatchProgress();
}

// 【新規】「この曲を抽選する」ボタンを押したときに初めてランダム選曲を行う関数
function triggerFirstLottery() {
    const randIdx = Math.floor(Math.random() * filteredSongs.length);
    // 重複禁止ルール（splice）を適用してプールから曲を抜き出す
    const song = filteredSongs.splice(randIdx, 1)[0]; 
    
    selectedSongs[currentRound] = song;
    initMatchProgress(); // 曲が決まった状態で画面を再描画
}


function initMatchProgress() {
    // 現在のラウンドの曲がすでに決まっているか（抽選済みか）をチェック
    const currentSong = selectedSongs[currentRound];
    const isSongSelected = (currentSong !== undefined);
    
    // 曲が決まっているなら曲名、決まっていないなら「？？？」にする
    const songTitleDisplay = isSongSelected ? `${currentSong.name} [${currentSong.rank}]` : "？？？ [？]";
    document.getElementById("gameStatusTitle").innerText = `第 ${currentRound + 1} 楽曲: ${songTitleDisplay}`;
    
    const playerIndex = currentRound % gameConfig.players.length;
    const player = gameConfig.players[playerIndex];

    let lifeDisplayHtml = "";
    if (gameConfig.scoringRule === 'bomb') {
        if (gameConfig.bombMode === 'secret') {
            lifeDisplayHtml = `<div style="font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 15px; color: #747d8c;">💣 残りライフ：？？</div>`;
        } else {
            const ratio = bombCurrentLife / bombMaxLife;
            const percentage = (ratio * 100).toFixed(0);
            let lifeColor = "#2ed573";
            let blinkClass = "";
            if (ratio < 0.1) { lifeColor = "#ff4757"; blinkClass = "life-blink"; }
            else if (ratio < 0.25) { lifeColor = "#ff4757"; }
            else if (ratio < 0.5) { lifeColor = "#ffa502"; }

            lifeDisplayHtml = `
                <div class="${blinkClass}" style="font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 5px; color: ${lifeColor};">💣 残りライフ：${bombCurrentLife} / ${bombMaxLife}</div>
                <div style="max-width: 400px; margin: 0 auto 20px auto; background-color: #ddd; border-radius: 10px; height: 16px; overflow: hidden; border: 1px solid #ccc;">
                    <div class="${blinkClass}" style="width: ${percentage}%; background-color: ${lifeColor}; height: 100%; transition: width 0.3s ease;"></div>
                </div>`;
        }
    }

    // 通常モード、または爆弾モードのときの「抽選ボタン」システム
    let actionButtonHtml = "";
    if (gameConfig.selectionMethod === 'normal' || gameConfig.scoringRule === 'bomb') {
        if (!isSongSelected) {
            // まだ曲が決まっていないときは「抽選する」ボタンを出す
            actionButtonHtml = `
                <div style="text-align: center; margin-bottom: 15px;">
                    <button type="button" class="btn" onclick="triggerFirstLottery()" style="margin-top:0; padding:10px 24px; font-size:16px; background-color:var(--primary-color); width:auto;">🎲 この曲を抽選する</button>
                </div>`;
        } else {
            // 曲が決まったあとは「この曲を引き直す」ボタンに切り替える
            actionButtonHtml = `
                <div style="text-align: center; margin-bottom: 15px;">
                    <button type="button" class="btn" onclick="redrawCurrentSong()" style="margin-top:0; padding:8px 16px; font-size:14px; background-color:var(--accent-color); width:auto;">🔄 この曲を引き直す</button>
                </div>`;
        }
    }

    let html = `
    ${lifeDisplayHtml}
    ${actionButtonHtml}

    <!-- 曲が決まるまでは入力フォームを少し薄くして、入力できないようにガード（disabled）をかける -->
    <div class="match-block" style="padding: 20px; opacity: ${isSongSelected ? '1' : '0.4'}; pointer-events: ${isSongSelected ? 'auto' : 'none'};">
        <p style="text-align:center; font-weight:bold; color:var(--primary-color); font-size:20px; margin-bottom: 20px;">
            🔥 ${player.name} さんのプレイ番です 🔥
        </p>
        <div style="max-width: 400px; margin: 0 auto;">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 18px; color: #2ed573;">● 良の数</label>
                <input type="number" id="ryo_${playerIndex}" placeholder="0" min="0" style="font-size: 20px; padding: 12px;" oninput="calculateAutoCombo(${playerIndex})" ${isSongSelected ? '' : 'disabled'}>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 18px; color: #ffa502;">● 可の数</label>
                <input type="number" id="ka_${playerIndex}" placeholder="0" min="0" style="font-size: 20px; padding: 12px;" oninput="calculateAutoCombo(${playerIndex})" ${isSongSelected ? '' : 'disabled'}>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 18px; color: #ff4757;">● 不可の数</label>
                <input type="number" id="fuka_${playerIndex}" placeholder="0" min="0" style="font-size: 20px; padding: 12px;" oninput="calculateAutoCombo(${playerIndex})" ${isSongSelected ? '' : 'disabled'}>
            </div>
            <div style="margin-top: 20px; padding: 15px; background: #fff; border: 2px dashed #ddd; border-radius: 8px; text-align: center;">
                <span style="font-size: 14px; color: #555; font-weight: bold;">【自動計算】最大コンボ数</span>
                <div id="autoComboDisplay_${playerIndex}" style="font-size: 28px; font-weight: bold; color: var(--dark-color); margin-top: 5px;">0</div>
            </div>
        </div>
    </div>`;
    
    document.getElementById("matchPlayArea").innerHTML = html;
    
    const btn = document.getElementById("actionBtn");
    // 曲が決まるまでは、一番下の「次のステップへ」ボタンを非表示にする
    btn.style.display = isSongSelected ? "block" : "none";
    
    if (gameConfig.scoringRule === 'bomb') {
        btn.innerText = "スコアを記録してダメージ判定へ";
    } else {
        btn.innerText = (currentRound === totalSongsToPlay - 1) ? "すべての結果を計算してリザルトへ" : "スコアを記録して次の曲へ";
    }
}

// リアルタイムでコンボ数を画面上で自動計算して表示する関数
function calculateAutoCombo(playerIndex) {
    const ryo = parseInt(document.getElementById(`ryo_${playerIndex}`).value) || 0;
    const ka = parseInt(document.getElementById(`ka_${playerIndex}`).value) || 0;
    const fuka = parseInt(document.getElementById(`fuka_${playerIndex}`).value) || 0;
    document.getElementById(`autoComboDisplay_${playerIndex}`).innerText = ryo + ka + fuka;
}


function handleGameAction() {
    const playerIndex = currentRound % gameConfig.players.length;
    
    const ryo = parseInt(document.getElementById(`ryo_${playerIndex}`).value) || 0;
    const ka = parseInt(document.getElementById(`ka_${playerIndex}`).value) || 0;
    const fuka = parseInt(document.getElementById(`fuka_${playerIndex}`).value) || 0;
    
    const combo = ryo + ka + fuka;
    if (combo === 0) {
        alert("数値を入力してください。");
        return;
    }
    
    // 【爆弾ルール】ダメージ計算とライフ減少処理
    if (gameConfig.scoringRule === 'bomb') {
        const damage = (ka * gameConfig.bombKaDamage) + (fuka * gameConfig.bombFukaDamage);
        bombCurrentLife -= damage;
        gameConfig.players[playerIndex].totalDamage += damage; // この人が削った累計ダメージ
        
        // ライフが0以下になったらトドメを刺された（終了時にプレイしていた）人を記録
        if (bombCurrentLife <= 0) {
            bombCurrentLife = 0;
            gameConfig.loserIndex = playerIndex; 
        }
    }
    
    gameConfig.players[playerIndex].results.push({
        songName: selectedSongs[currentRound].name,
        maxCombo: combo,
        ryo: ryo,
        ka: ka,
        fuka: fuka
    });
    
    // 【爆弾ルール】ライフが尽きたらその場で即終了、リザルト画面へ
    if (gameConfig.scoringRule === 'bomb' && bombCurrentLife <= 0) {
        alert(`💥 爆弾が爆発しました！ 💥\n${gameConfig.players[playerIndex].name} さんのプレイでライフが 0 になりました。試合終了です！`);
        showFinalResults();
        return;
    }
    
    currentRound++;
    
    // 次の曲への遷移処理（通常ルール、または爆弾ルールが継続している場合）
    if (gameConfig.scoringRule === 'bomb' || currentRound < totalSongsToPlay) {
        if (gameConfig.selectionMethod === 'normal') {
            drawNextNormalSong();
        } else {
            // ドラフト選択でプールが切れたら自動的に新しい曲を補給する安全処理
            if (currentRound >= selectedSongs.length) {
                const randIdx = Math.floor(Math.random() * filteredSongs.length);
                selectedSongs.push(filteredSongs[randIdx]);
            }
            initMatchProgress();
        }
    } else {
        showFinalResults();
    }
}

function abortTournament() {
    if (confirm("本当にこの試合を中断して、最初の設定画面に戻りますか？\n（現在の記録はすべて消去されます）")) {
        location.reload();
    }
}

function showFinalResults() {
    document.getElementById("gameStatusTitle").innerText = "🏆 最終リザルト発表 🏆";
    document.getElementById("selectionArea").innerHTML = "";
    
    const customKa = parseInt(document.getElementById("customKaPoint").value) || 1;
    const customFuka = parseInt(document.getElementById("customFukaPoint").value) || 2;
    
    let scoredPlayers = gameConfig.players.map((player, pIdx) => {
        let totalRatioSum = 0, totalPenaltyPoints = 0;
        let totalRyo = 0, totalKa = 0, totalFuka = 0;
        
        let rowsArray = [];
        
        player.results.forEach((res, index) => {
            totalRatioSum += (res.ryo / res.maxCombo) * 100;
            totalPenaltyPoints += (res.ka * customKa) + (res.fuka * customFuka);
            totalRyo += res.ryo;
            totalKa += res.ka;
            totalFuka += res.fuka;
            
            const songRatio = ((res.ryo / res.maxCombo) * 100).toFixed(2);
            
            let songRank = "-";
            const targetSong = SONG_DATABASE.find(s => s.name === res.songName);
            if (targetSong) {
                songRank = targetSong.rank;
            }
            
            // 【修正】良の割合を一番右端に配置するため、セルの順番を「良・可・不可・良の割合」の順に変更
            rowsArray.push(`
                <td>${res.songName}</td>
                <td><span class="badge">[${songRank}]</span></td>
                <td>${res.ryo}</td>
                <td>${res.ka}</td>
                <td>${res.fuka}</td>
                <td style="font-weight:bold; color:var(--primary-color);">${songRatio}%</td>
            `);
        });
        
        let displayScore = "";
        if (gameConfig.scoringRule === 'bomb') {
            displayScore = `累計被ダメージ: ${player.totalDamage} pt`;
            if (pIdx === gameConfig.loserIndex) displayScore += " (死亡)";
        } else {
            displayScore = (gameConfig.scoringRule === 'ratio') ? `${(totalRatioSum / gameConfig.songCountPerPlayer).toFixed(2)}%` : `${totalPenaltyPoints} pt (減点)`;
        }
        
        return {
            id: pIdx,
            name: player.name,
            totalRyo: totalRyo,
            totalKa: totalKa,
            totalFuka: totalFuka,
            totalDamage: player.totalDamage,
            displayScore: displayScore,
            playCount: player.results.length,
            rowsArray: rowsArray
        };
    });
    
    if (gameConfig.scoringRule === 'bomb') {
        scoredPlayers.sort((a, b) => {
            if (a.id === gameConfig.loserIndex) return 1;
            if (b.id === gameConfig.loserIndex) return -1;
            return a.totalDamage - b.totalDamage;
        });
    } else {
        if (gameConfig.scoringRule === 'ratio') {
            scoredPlayers.sort((a, b) => parseFloat(b.displayScore) - parseFloat(a.displayScore));
        } else {
            scoredPlayers.sort((a, b) => parseFloat(a.displayScore) - parseFloat(b.displayScore));
        }
    }
    
    if (gameConfig.scoringRule === 'bomb') {
        document.getElementById("gameStatusTitle").innerHTML += `<br><span style="font-size:14px; color:#555;">(爆弾ルール終了 / 設定時の最大ライフ: ${bombMaxLife})</span>`;
    }
    
    // ① 総合順位表（スッキリ版）
    let html = `
    <table class="result-table">
        <thead>
            <tr>
                <th>順位</th>
                <th>プレイヤー名</th>
                <th>判定基準スコア</th>
                <th>総良</th>
                <th>総可</th>
                <th>総不可</th>
            </tr>
        </thead>
        <tbody>`;
        
    scoredPlayers.forEach((p, idx) => {
        html += `
        <tr class="rank-${idx + 1}">
            <td>${idx + 1}位</td>
            <td><strong>${p.name}</strong></td>
            <td>${p.displayScore}</td>
            <td>${p.totalRyo}</td>
            <td>${p.totalKa}</td>
            <td>${p.totalFuka}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    
    // ② 【修正版】横長の詳細テーブル（ヘッダーと縦結合のズレを完全修正）
    let detailTableHtml = `
    <div id="detailScoreSection" style="display: none; margin-top: 20px; overflow-x: auto;">
        <h3 style="text-align:center; margin-bottom:15px; color:var(--dark-color);">📊 全楽曲・プレイ詳細リザルト</h3>
        <table class="result-table" style="font-size:13px; width:100%;">
            <thead>
                <tr>
                    <th>プレイヤー</th>
                    <th>曲名</th>
                    <th>難易度帯</th>
                    <th>良</th>
                    <th>可</th>
                    <th>不可</th>
                    <th>良の割合</th>
                </tr>
            </thead>
            <tbody>`;
            
    scoredPlayers.forEach(p => {
        p.rowsArray.forEach((songCells, i) => {
            if (i === 0) {
                // 1曲目の行：プレイヤー名セルのみを曲数分（rowspan）縦結合。右端の全体合計セルは削除しました
                detailTableHtml += `
                <tr>
                    <td rowspan="${p.playCount}" style="font-weight:bold; background:#f9f9f9; vertical-align:middle;">${p.name}</td>
                    ${songCells}
                </tr>`;
            } else {
                // 2曲目以降の行
                detailTableHtml += `
                <tr>
                    ${songCells}
                </tr>`;
            }
        });
    });
    
    detailTableHtml += `</tbody></table></div>`;
    html += detailTableHtml;
    
    // ③ ボタンエリア
    html += `
    <div style="text-align: center; margin-top: 25px;">
        <button class="btn" id="toggleDetailBtn" onclick="toggleDetailScoreTable()" style="background-color: var(--accent-color); width: auto; padding: 10px 24px; font-size: 15px; margin-top: 0; margin-bottom: 15px;">🔍 詳細なリザルトを表示</button>
        <br>
        <button class="btn btn-accent" onclick="location.reload()" style="width: auto; padding: 12px 30px; font-size: 16px; margin-top: 0;">🔄 もう一度遊ぶ</button>
    </div>`;
    
    document.getElementById("matchPlayArea").innerHTML = html;
    document.getElementById("actionBtn").style.display = "none";
    document.getElementById("cancelBtn").style.display = "none";
}

function toggleDetailScoreTable() {
    const section = document.getElementById("detailScoreSection");
    const btn = document.getElementById("toggleDetailBtn");
    
    if (section.style.display === "none") {
        section.style.display = "block";
        btn.innerText = "❌ 詳細なリザルトを閉じる";
        btn.style.backgroundColor = "#747d8c";
    } else {
        section.style.display = "none";
        btn.innerText = "🔍 詳細なリザルトを表示";
        btn.style.backgroundColor = "var(--accent-color)";
    }
}

// 判定方法が「可・不可の数」のときだけポイント入力枠を出す関数
function togglePenaltyInputs() {
    const rule = document.getElementById("scoringRule").value;
    const container = document.getElementById("penaltyPointsContainer");
    if (rule === "points") {
        container.style.display = "grid";
    } else {
        container.style.display = "none";
    }
}

// 【修正版】難易度チェックボックスを「すべてチェック / すべて外す」関数
window.checkAllRanks = function(status) {
    const checkboxes = document.getElementsByName("diffCheck");
    checkboxes.forEach(cb => {
        cb.checked = status;
    });
};

// 【修正版】現在表示されている曲をアラート確認付きでランダムに引き直す関数
function redrawCurrentSong() {
    // 【新規】確認画面を出し、「キャンセル」が押されたらここで処理を終了する
    if (!confirm("本当にこの曲を引き直しますか？\n（別のランダムな曲に切り替わります）")) {
        return;
    }
    
    // 「OK」が押された場合のみ、以下の引き直し処理が実行される
    const randIdx = Math.floor(Math.random() * filteredSongs.length);
    const newSong = filteredSongs[randIdx];
    
    selectedSongs[currentRound] = newSong;
    initMatchProgress();
}
</script>
