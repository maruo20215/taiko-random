<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓の達人 ★10地力表ランダム選曲</title>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --primary-color: #ff4757;
            --secondary-color: #2ed573;
            --accent-color: #ffa502;
            --dark-color: #2f3542;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 25px;
        }
        .setup-section,
        .game-section {
            display: none;
        }
        .active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-accent {
            background-color: var(--accent-color);
        }
        .song-pool {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .song-card {
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            background: #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .song-card .badge {
            font-size: 11px;
            background: #ffeaa7;
            color: #d63031;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
        }
        .match-block {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .player-input-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-row {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            text-align: center;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .result-table th,
        .result-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .result-table th {
            background-color: #f1f2f6;
        }
        .rank-1 {
            background-color: #fff200;
            font-weight: bold;
        }
        .song-history {
            text-align: left;
            font-size: 12px;
            color: #555;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 6px;
            margin-top: 5px;
            font-weight: normal;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>太鼓の達人 ★10地力表ランダム選曲</h1>
    <div id="setupSection" class="setup-section active">
        <div class="form-group">
            <label>1. プレイ人数 (1~4人)</label>
            <select id="playerCount" onchange="updatePlayerInputs()">
                <option value="1">1人</option>
                <option value="2" selected>2人</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
            </select>
        </div>
        <div id="playerNamesContainer"></div>
        <div class="form-group">
            <label>2. 1人あたりのプレイ曲数(1~7曲)</label>
            <select id="songCount">
                <option value="1">1曲</option>
                <option value="2">2曲</option>
                <option value="3" selected>3曲</option>
                <option value="4">4曲</option>
                <option value="5">5曲</option>
                <option value="6">6曲</option>
                <option value="7">7曲</option>
            </select>
        </div>
        <div class="form-group">
            <label>3. 勝敗の判定方法</label>
            <select id="scoringRule" onchange="togglePenaltyInputs()">
                <option value="ratio">1. 良の割合(全体の割合で順位を決定)</option>
                <option value="points">2. 可・不可の数(カスタム減点方式)</option>
            </select>
        </div>
        <!-- 【新規】可・不可のポイントを自分で決める入力枠（初期状態は非表示） -->
        <div id="penaltyPointsContainer" class="grid-2" style="display: none; margin-bottom: 20px;">
            <div>
                <label style="font-size:12px;">可の減点ポイント</label>
                <input type="number" id="customKaPoint" value="1" min="0">
            </div>
            <div>
                <label style="font-size:12px;">不可の減点ポイント</label>
                <input type="number" id="customFukaPoint" value="2" min="0">
            </div>
        </div>
        <div class="form-group">
            <label>4. ランダム選曲の方法</label>
            <select id="selectionMethod">
                <option value="normal">1. 通常 (1曲ずつ選曲・即リザルト)</option>
                <option value="draft">2. 選択 (1.5倍を全抽選し、先行から交互に選ぶ)</option>
            </select>
        </div>
        <div class="form-group">
            <label>5. 対象にする難易度帯（複数選択可）</label>
            <!-- 【新規】すべてチェック・外すボタン -->
            <div style="margin-bottom: 10px;">
                <button type="button" class="btn" onclick="checkAllRanks(true)" style="margin-top:0; margin-right:10px; padding:6px 12px; font-size:12px; background-color:#747d8c; width:auto;">すべてチェック</button>
                <button type="button" class="btn" onclick="checkAllRanks(false)" style="margin-top:0; padding:6px 12px; font-size:12px; background-color:#747d8c; width:auto;">すべて外す</button>
            </div>
            <div id="difficultyCheckboxContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; background: #f1f2f6; padding: 15px; border-radius: 8px;"></div>
        </div>

        <button class="btn" onclick="startTournament()">設定を確定して試合開始！</button>
    </div>
    <div id="gameSection" class="game-section">
        <h2 id="gameStatusTitle" style="text-align:center;"></h2>
        <div id="selectionArea"></div>
        <div id="matchPlayArea"></div>
        <div class="grid-2" style="margin-top: 15px;">
            <button id="cancelBtn" class="btn btn-accent" onclick="abortTournament()" style="background-color:#747d8c; margin-top:0;">試合を中断する</button>
            <button id="actionBtn" class="btn" onclick="handleGameAction()" style="margin-top:0;">次のステップへ</button>
        </div>
    </div>
</div>

window.onload = function () {
    const container = document.getElementById("difficultyCheckboxContainer");
    container.innerHTML = "";
    
    // 【修正】slice().reverse() を使って、元のデータを壊さずに「難しい順（SSから）」にしてループを回す
    [...DIFF_RANKS].reverse().forEach((rank, idx) => {
        const count = SONG_DATABASE.filter(s => s.rank === rank || s.rank.replace("地力", "") === rank).length;
        
        container.innerHTML += `
            <label style="display: inline-flex; align-items: center; font-weight: normal; cursor: pointer; font-size: 14px;">
                <input type="checkbox" name="diffCheck" value="${rank}" style="width: auto; margin-right: 6px;" checked>
                ${rank} (${count}曲)
            </label>
        `;
    });
    
    updatePlayerInputs();
};



function updatePlayerInputs() {
    const count = parseInt(document.getElementById("playerCount").value);
    const container = document.getElementById("playerNamesContainer");
    container.innerHTML = `
        <label>プレイヤー名と順番設定</label>
        <button type="button" class="btn" onclick="randomizeOrder()" style="margin-top:0; margin-bottom:10px; padding:6px 12px; font-size:12px; background-color:var(--accent-color); width:auto;">順番をランダムに決める</button>
    `;
    
    for (let i = 1; i <= count; i++) {
        let options = "";
        for (let k = 1; k <= count; k++) {
            options += `<option value="${k}" ${k === i ? 'selected' : ''}>${k}番手</option>`;
        }
        
        container.innerHTML += `
        <div class="form-group grid-2" style="margin-bottom:8px;">
            <input type="text" id="pName${i}" value="Player ${i}">
            <select id="pOrder${i}">
                ${options}
            </select>
        </div>`;
    }
}

// 順番をランダムに決める機能
function randomizeOrder() {
    const count = parseInt(document.getElementById("playerCount").value);
    let orders = Array.from({length: count}, (_, i) => i + 1);
    
    for (let i = orders.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [orders[i], orders[j]] = [orders[j], orders[i]];
    }
    
    for (let i = 1; i <= count; i++) {
        document.getElementById(`pOrder${i}`).value = orders[i - 1];
    }
}

let gameConfig = {};
let filteredSongs = [];
let drawnSongs = [];
let selectedSongs = [];
let currentRound = 0;
let totalSongsToPlay = 0;
let draftPickerIndex = 0;

function startTournament() {
    const pCount = parseInt(document.getElementById("playerCount").value);
    let players = [];
    for (let i = 1; i <= pCount; i++) {
        players.push({
            name: document.getElementById(`pName${i}`).value,
            order: parseInt(document.getElementById(`pOrder${i}`).value),
            results: []
        });
    }
    
    // プレイヤーを指定された手番（順番）通りに並び替える
    players.sort((a, b) => a.order - b.order);
    
    // 【新規】チェックが入っている難易度帯をすべて配列に集める
    const checkboxes = document.getElementsByName("diffCheck");
    let selectedRanks = [];
    checkboxes.forEach(cb => {
        if (cb.checked) {
            selectedRanks.push(cb.value);
        }
    });
    
    // 難易度が一つも選ばれていない場合は警告を出して止める
    if (selectedRanks.length === 0) {
        alert("難易度帯を最低1つは選択してください！");
        return;
    }
    
    // 【新規】選択された難易度帯に合致する曲だけをデータベースから抽出
    filteredSongs = SONG_DATABASE.filter(song => {
        const cleanRank = song.rank.replace("地力", "");
        return selectedRanks.includes(song.rank) || selectedRanks.includes(cleanRank);
    });
    
    // 該当する曲がデータベースに1曲もない場合の安全処理
    if (filteredSongs.length === 0) {
        alert("選択された難易度帯の曲がデータベースにありません。範囲を見直してください。");
        return;
    }
    
    const songCountPerPlayer = parseInt(document.getElementById("songCount").value);
    totalSongsToPlay = songCountPerPlayer * pCount;
    
    gameConfig = {
        players: players,
        songCountPerPlayer: songCountPerPlayer,
        scoringRule: document.getElementById("scoringRule").value,
        selectionMethod: document.getElementById("selectionMethod").value
    };
    
    document.getElementById("setupSection").classList.remove("active");
    document.getElementById("gameSection").classList.add("active");
    
    if (gameConfig.selectionMethod === 'draft') {
        initDraftMode();
    } else {
        initNormalMode();
    }
}


function initDraftMode() {
    const poolSize = Math.ceil(totalSongsToPlay * 1.5);
    drawnSongs = [];
    let tempDb = [...filteredSongs];
    for (let i = 0; i < poolSize; i++) {
        if (tempDb.length === 0) tempDb = [...filteredSongs];
        const randIdx = Math.floor(Math.random() * tempDb.length);
        drawnSongs.push(tempDb.splice(randIdx, 1)[0]); // [0]を付与してオブジェクトを正しく抽出
    }
    selectedSongs = [];
    draftPickerIndex = 0;
    renderDraftScreen();
}


function initDraftMode() {
    const poolSize = Math.ceil(totalSongsToPlay * 1.5);
    drawnSongs = [];
    let tempDb = [...filteredSongs];
    for (let i = 0; i < poolSize; i++) {
        if (tempDb.length === 0) tempDb = [...filteredSongs];
        const randIdx = Math.floor(Math.random() * tempDb.length);
        drawnSongs.push(tempDb.splice(randIdx, 1)[0]);
    }
    selectedSongs = [];
    draftPickerIndex = 0;
    renderDraftScreen();
}

function renderDraftScreen() {
    const activePlayer = gameConfig.players[draftPickerIndex];
    document.getElementById("gameStatusTitle").innerText = `【選曲フェーズ】\n${activePlayer.name}さん曲を選んでください (${selectedSongs.length + 1}/${totalSongsToPlay}曲目)`;
    
    let html = `<p style="text-align:center;">必要な合計曲数: ${totalSongsToPlay}曲 / 現在選ばれた曲数: ${selectedSongs.length}曲</p><div class="song-pool">`;
    drawnSongs.forEach((song, idx) => {
        html += `<div class="song-card" onclick="selectDraftSong(${idx})"><span class="badge">[${song.rank}]</span><br>${song.name}</div>`;
    });
    html += '</div>';
    document.getElementById("selectionArea").innerHTML = html;
    document.getElementById("matchPlayArea").innerHTML = "";
    document.getElementById("actionBtn").style.display = "none";
}

function selectDraftSong(idx) {
    const song = drawnSongs.splice(idx, 1)[0];
    selectedSongs.push(song);
    if (selectedSongs.length < totalSongsToPlay) {
        draftPickerIndex = (draftPickerIndex + 1) % gameConfig.players.length;
        renderDraftScreen();
    } else {
        currentRound = 0;
        document.getElementById("selectionArea").innerHTML = "";
        initMatchProgress();
    }
}

function initNormalMode() {
    selectedSongs = [];
    drawNextNormalSong();
}

function drawNextNormalSong() {
    const randIdx = Math.floor(Math.random() * filteredSongs.length);
    selectedSongs.push(filteredSongs[randIdx]);
    initMatchProgress();
}

            <div style="margin-top: 20px; padding: 15px; background: #fff; border: 2px dashed #ddd; border-radius: 8px; text-align: center;">
                <span style="font-size: 14px; color: #555; font-weight: bold;">【自動計算】最大コンボ数</span>
                <div id="autoComboDisplay_${playerIndex}" style="font-size: 28px; font-weight: bold; color: var(--dark-color); margin-top: 5px;">0</div>
            </div>
        </div>
    </div>`;
    
    document.getElementById("matchPlayArea").innerHTML = html;
    
    const btn = document.getElementById("actionBtn");
    btn.style.display = "block";
    btn.innerText = (currentRound === totalSongsToPlay - 1) ? "すべての結果を計算してリザルトへ" : "スコアを記録して次の曲へ";
}

// リアルタイムでコンボ数を画面上で自動計算して表示する関数
function calculateAutoCombo(playerIndex) {
    const ryo = parseInt(document.getElementById(`ryo_${playerIndex}`).value) || 0;
    const ka = parseInt(document.getElementById(`ka_${playerIndex}`).value) || 0;
    const fuka = parseInt(document.getElementById(`fuka_${playerIndex}`).value) || 0;
    document.getElementById(`autoComboDisplay_${playerIndex}`).innerText = ryo + ka + fuka;
}


function handleGameAction() {
    const playerIndex = currentRound % gameConfig.players.length;
    
    const ryo = parseInt(document.getElementById(`ryo_${playerIndex}`).value) || 0;
    const ka = parseInt(document.getElementById(`ka_${playerIndex}`).value) || 0;
    const fuka = parseInt(document.getElementById(`fuka_${playerIndex}`).value) || 0;
    
    // 良＋可＋不可を自動で最大コンボ数にする
    const combo = ryo + ka + fuka;
    
    // 最低でも1個以上の入力（すべて0ではない状態）があるか確認
    if (combo === 0) {
        alert("数値を入力してください。");
        return;
    }
    
    gameConfig.players[playerIndex].results.push({
        songName: selectedSongs[currentRound].name,
        maxCombo: combo,
        ryo: ryo,
        ka: ka,
        fuka: fuka
    });
    
    currentRound++;
    if (currentRound < totalSongsToPlay) {
        if (gameConfig.selectionMethod === 'normal') {
            drawNextNormalSong();
        } else {
            initMatchProgress();
        }
    } else {
        showFinalResults();
    }
}


function abortTournament() {
    if (confirm("本当にこの試合を中断して、最初の設定画面に戻りますか？\n（現在の記録はすべて消去されます）")) {
        location.reload();
    }
}

function showFinalResults() {
    document.getElementById("gameStatusTitle").innerText = "🏆 最終リザルト発表 🏆";
    document.getElementById("selectionArea").innerHTML = "";
    
    // 自分で設定した減点ポイントを読み込む（入力がなければ可1、不可2）
    const customKa = parseInt(document.getElementById("customKaPoint").value) || 1;
    const customFuka = parseInt(document.getElementById("customFukaPoint").value) || 2;
    
    let scoredPlayers = gameConfig.players.map(player => {
        let totalRatioSum = 0, totalPenaltyPoints = 0;
        let totalRyo = 0, totalKa = 0, totalFuka = 0;
        let detailsHtml = '<div class="song-history"><strong>【プレイ曲の内訳】</strong><br>';
        
        player.results.forEach((res, index) => {
            totalRatioSum += (res.ryo / res.maxCombo) * 100;
            
            // 自分で決めたカスタム減点ポイントを掛け算する
            totalPenaltyPoints += (res.ka * customKa) + (res.fuka * customFuka);
            
            totalRyo += res.ryo;
            totalKa += res.ka;
            totalFuka += res.fuka;
            
            const songRatio = ((res.ryo / res.maxCombo) * 100).toFixed(2);
            detailsHtml += `・${res.songName} : 良 ${res.ryo} / 可 ${res.ka} / 不可 ${res.fuka} (${songRatio}%)<br>`;
        });
        detailsHtml += '</div>';
        
        const finalScoreValue = (gameConfig.scoringRule === 'ratio') ? 
            (totalRatioSum / gameConfig.songCountPerPlayer).toFixed(2) : totalPenaltyPoints;
            
        const displayScore = (gameConfig.scoringRule === 'ratio') ? `${finalScoreValue}%` : `${finalScoreValue} pt (減点)`;
        
        return {
            name: player.name,
            finalScoreValue: parseFloat(finalScoreValue),
            totalRyo: totalRyo,
            totalKa: totalKa,
            totalFuka: totalFuka,
            displayScore: displayScore,
            detailsHtml: detailsHtml
        };
    });
    
    if (gameConfig.scoringRule === 'ratio') {
        scoredPlayers.sort((a, b) => b.finalScoreValue - a.finalScoreValue);
    } else {
        scoredPlayers.sort((a, b) => a.finalScoreValue - b.finalScoreValue);
    }
    
    let html = `
    <table class="result-table">
        <thead>
            <tr>
                <th>順位</th>
                <th>プレイヤー名</th>
                <th>判定基準スコア</th>
                <th>総良</th>
                <th>総可</th>
                <th>総不可</th>
            </tr>
        </thead>
        <tbody>`;
        
    scoredPlayers.forEach((p, idx) => {
        html += `
        <tr class="rank-${idx + 1}">
            <td>${idx + 1}位</td>
            <td>
                <strong>${p.name}</strong>
                ${p.detailsHtml}
            </td>
            <td>${p.displayScore}</td>
            <td>${p.totalRyo}</td>
            <td>${p.totalKa}</td>
            <td>${p.totalFuka}</td>
        </tr>`;
    });
    
    html += `
        </tbody>
    </table>
    <button class="btn btn-accent" onclick="location.reload()" style="margin-top:20px;">もう一度遊ぶ</button>`;
    
    document.getElementById("matchPlayArea").innerHTML = html;
    document.getElementById("actionBtn").style.display = "none";
    document.getElementById("cancelBtn").style.display = "none";
}

// 判定方法が「可・不可の数」のときだけポイント入力枠を出す関数
function togglePenaltyInputs() {
    const rule = document.getElementById("scoringRule").value;
    const container = document.getElementById("penaltyPointsContainer");
    if (rule === "points") {
        container.style.display = "grid";
    } else {
        container.style.display = "none";
    }
}

// 【修正版】難易度チェックボックスを「すべてチェック / すべて外す」関数
window.checkAllRanks = function(status) {
    const checkboxes = document.getElementsByName("diffCheck");
    checkboxes.forEach(cb => {
        cb.checked = status;
    });
};

// 【修正版】現在表示されている曲をアラート確認付きでランダムに引き直す関数
function redrawCurrentSong() {
    // 【新規】確認画面を出し、「キャンセル」が押されたらここで処理を終了する
    if (!confirm("本当にこの曲を引き直しますか？\n（別のランダムな曲に切り替わります）")) {
        return;
    }
    
    // 「OK」が押された場合のみ、以下の引き直し処理が実行される
    const randIdx = Math.floor(Math.random() * filteredSongs.length);
    const newSong = filteredSongs[randIdx];
    
    selectedSongs[currentRound] = newSong;
    initMatchProgress();
}
</script>
