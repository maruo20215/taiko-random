<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓の達人 ★10 ランダム選曲バトル</title>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --primary-color: #ff4757;
            --secondary-color: #2ed573;
            --accent-color: #ffa502;
            --dark-color: #2f3542;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 25px;
        }
        .setup-section, .game-section {
            display: none;
        }
        .active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-accent { background-color: var(--accent-color); }
        
        .song-pool {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .song-card {
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            background: #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .song-card .badge {
            font-size: 11px;
            background: #ffeaa7;
            color: #d63031;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
        }
        
        .match-block {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .player-input-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-row { font-size: 12px; font-weight: bold; color: #555; text-align: center; }
        
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .result-table th, .result-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .result-table th { background-color: #f1f2f6; }
        .rank-1 { background-color: #fff200; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>太鼓の達人 ★10 地力表ランダム選曲</h1>

    <div id="setupSection" class="setup-section active">
        <div class="form-group">
            <label>1. プレイ人数 (1〜4人)</label>
            <select id="playerCount" onchange="updatePlayerInputs()">
                <option value="1">1人</option>
                <option value="2" selected>2人</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
            </select>
        </div>

        <div id="playerNamesContainer"></div>

        <div class="form-group">
            <label>2. 1人あたりのプレイ曲数 (1〜7曲)</label>
            <select id="songCount">
                <option value="1">1曲</option>
                <option value="2">2曲</option>
                <option value="3" selected>3曲</option>
                <option value="4">4曲</option>
                <option value="5">5曲</option>
                <option value="6">6曲</option>
                <option value="7">7曲</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. 勝敗の判定方法</label>
            <select id="scoringRule">
                <option value="ratio">1. 良の割合（全体の割合で順位を決定）</option>
                <option value="points">2. 可・不可の数（可:1pt, 不可:2ptの減点方式）</option>
            </select>
        </div>

        <div class="form-group">
            <label>4. ランダム選曲の方法</label>
            <select id="selectionMethod">
                <option value="normal">1. 通常（1曲ずつ選曲・即リザルト）</option>
                <option value="draft">2. 選択（1.5倍を全抽選し、先行から交互に選ぶ）</option>
            </select>
        </div>

        <div class="form-group">
            <label>5. 難易度帯（全良難易度）の上限・下限</label>
            <div class="grid-2">
                <div>
                    <label style="font-size:12px;">下限</label>
                    <select id="diffMin"></select>
                </div>
                <div>
                    <label style="font-size:12px;">上限</label>
                    <select id="diffMax"></select>
                </div>
            </div>
        </div>

        <button class="btn" onclick="startTournament()">設定を確定して試合開始！</button>
    </div>

    <div id="gameSection" class="game-section">
        <h2 id="gameStatusTitle" style="text-align:center;"></h2>
        <div id="selectionArea"></div>
        <div id="matchPlayArea"></div>
        <button id="actionBtn" class="btn" onclick="handleGameAction()">次のステップへ</button>
    </div>
</div>
