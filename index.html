<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓の達人 ★10 地力表ランダム選曲</title>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --primary-color: #ff4757;
            --secondary-color: #2ed573;
            --accent-color: #ffa502;
            --dark-color: #2f3542;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 25px;
        }
        .setup-section, .game-section {
            display: none;
        }
        .active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-accent { background-color: var(--accent-color); }
        
        .song-pool {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .song-card {
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            background: #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .song-card .badge {
            font-size: 11px;
            background: #ffeaa7;
            color: #d63031;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
        }
        
        .match-block {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .player-input-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-row { font-size: 12px; font-weight: bold; color: #555; text-align: center; }
        
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .result-table th, .result-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .result-table th { background-color: #f1f2f6; }
        .rank-1 { background-color: #fff200; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>太鼓の達人 ★10 地力表ランダム選曲</h1>

    <div id="setupSection" class="setup-section active">
        <div class="form-group">
            <label>1. プレイ人数 (1〜4人)</label>
            <select id="playerCount" onchange="updatePlayerInputs()">
                <option value="1">1人</option>
                <option value="2" selected>2人</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
            </select>
        </div>

        <div id="playerNamesContainer"></div>

        <div class="form-group">
            <label>2. 1人あたりのプレイ曲数 (1〜7曲)</label>
            <select id="songCount">
                <option value="1">1曲</option>
                <option value="2">2曲</option>
                <option value="3" selected>3曲</option>
                <option value="4">4曲</option>
                <option value="5">5曲</option>
                <option value="6">6曲</option>
                <option value="7">7曲</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. 勝敗の判定方法</label>
            <select id="scoringRule">
                <option value="ratio">1. 良の割合（全体の割合で順位を決定）</option>
                <option value="points">2. 可・不可の数（可:1pt, 不可:2ptの減点方式）</option>
            </select>
        </div>

        <div class="form-group">
            <label>4. ランダム選曲の方法</label>
            <select id="selectionMethod">
                <option value="normal">1. 通常（1曲ずつ選曲・即リザルト）</option>
                <option value="draft">2. 選択（1.5倍を全抽選し、先行から交互に選ぶ）</option>
            </select>
        </div>

        <div class="form-group">
            <label>5. 難易度帯（全良難易度）の上限・下限</label>
            <div class="grid-2">
                <div>
                    <label style="font-size:12px;">下限</label>
                    <select id="diffMin"></select>
                </div>
                <div>
                    <label style="font-size:12px;">上限</label>
                    <select id="diffMax"></select>
                </div>
            </div>
        </div>

        <button class="btn" onclick="startTournament()">設定を確定して試合開始！</button>
    </div>

    <div id="gameSection" class="game-section">
        <h2 id="gameStatusTitle" style="text-align:center;"></h2>
        <div id="selectionArea"></div>
        <div id="matchPlayArea"></div>
        <button id="actionBtn" class="btn" onclick="handleGameAction()">次のステップへ</button>
    </div>
</div>

    { name: "Extreme End（表）", rank: "個人差D" }, { name: "Emma【普通】", rank: "個人差D" }, { name: "【双打】 Garakuta Doll Play", rank: "個人差D" }, { name: "タイコタイム", rank: "個人差D" },
    { name: "R.I.", rank: "地力E" }, { name: "EkiBEN2000", rank: "地力E" }, { name: "Calamity Fortune（表）", rank: "地力E" }, { name: "【双打】 紅", rank: "地力E" }, { name: "さちさちにしてあげる♪", rank: "地力E" }, { name: "SUPERNOVA", rank: "地力E" }, { name: "タベルナ2000", rank: "地力E" }, { name: "ヒバナ", rank: "地力E" },
    { name: "そつおめしき", rank: "個人差E" }, { name: "初音ミクの激唱", rank: "個人差E" }, { name: "パン vs ごはん！ 大決戦！【普通】", rank: "個人差E" }, { name: "Black Rose Apostle", rank: "個人差E" }, { name: "マツヨイナイトバグ", rank: "個人差E" },
    { name: "X-DAY2000", rank: "地力F" }, { name: "【双打】 KAGEKIYO", rank: "地力F" }, { name: "旋風ノ舞【天】", rank: "地力F" }, { name: "チルノのパーフェクトさんすう教室", rank: "地力F" }, { name: "拝啓ドッペルゲンガー", rank: "地力F" }, { name: "BATTLE NO.1【普通】", rank: "地力F" }
];

window.onload = function() {
    const minSelect = document.getElementById("diffMin");
    const maxSelect = document.getElementById("diffMax");
    minSelect.innerHTML = "";
    maxSelect.innerHTML = "";
    DIFF_RANKS.forEach((rank, idx) => {
        minSelect.add(new Option(rank, idx));
        maxSelect.add(new Option(rank, idx));
    });
    minSelect.value = 0;
    maxSelect.value = DIFF_RANKS.length - 1;
    updatePlayerInputs();
};

function updatePlayerInputs() {
    const count = parseInt(document.getElementById("playerCount").value);
    const container = document.getElementById("playerNamesContainer");
    container.innerHTML = "<label>プレイヤー名と順番設定</label>";
    for(let i=1; i<=count; i++) {
        container.innerHTML += `
            <div class="form-group grid-2" style="margin-bottom:8px;">
                <input type="text" id="pName${i}" value="Player ${i}">
                <select id="pOrder${i}">
                    ${Array.from({length: count}, (_, k) => `<option value="${k+1}" ${k+1===i?'selected':''}>${k+1}番手</option>`).join('')}
                </select>
            </div>
        `;
    }
}

let gameConfig = {};
let filteredSongs = [];
let drawnSongs = [];
let selectedSongs = [];
let currentRound = 0;
let totalSongsToPlay = 0;
let draftPickerIndex = 0;

function startTournament() {
    const pCount = parseInt(document.getElementById("playerCount").value);
    let players = [];
    for(let i=1; i<=pCount; i++) {
        players.push({
            name: document.getElementById(`pName${i}`).value,
            order: parseInt(document.getElementById(`pOrder${i}`).value),
            results: []
        });
    }
    players.sort((a,b) => a.order - b.order);

    const minIdx = parseInt(document.getElementById("diffMin").value);
    const maxIdx = parseInt(document.getElementById("diffMax").value);
    if(minIdx > maxIdx) {
        alert("難易度の下限が上限を超えています！");
        return;
    }

    filteredSongs = SONG_DATABASE.filter(song => {
        const cleanRank = song.rank.replace("地力", "");
        let idx = DIFF_RANKS.indexOf(song.rank);
        if(idx === -1) idx = DIFF_RANKS.indexOf(cleanRank);
        return idx >= minIdx && idx <= maxIdx;
    });

    if(filteredSongs.length === 0) {
        alert("選択された難易度帯の曲がデータベースにありません。範囲を広げてください。");
        return;
    }

    const songCountPerPlayer = parseInt(document.getElementById("songCount").value);
    totalSongsToPlay = songCountPerPlayer * pCount;

    gameConfig = {
        players: players,
        songCountPerPlayer: songCountPerPlayer,
        scoringRule: document.getElementById("scoringRule").value,
        selectionMethod: document.getElementById("selectionMethod").value
    };

    document.getElementById("setupSection").classList.remove("active");
    document.getElementById("gameSection").classList.add("active");

    if(gameConfig.selectionMethod === 'draft') {
        initDraftMode();
    } else {
        initNormalMode();
    }
}

function initDraftMode() {
    const poolSize = Math.ceil(totalSongsToPlay * 1.5);
    drawnSongs = [];
    let tempDb = [...filteredSongs];
    for(let i=0; i<poolSize; i++) {
        if(tempDb.length === 0) tempDb = [...filteredSongs];
        const randIdx = Math.floor(Math.random() * tempDb.length);
        drawnSongs.push(tempDb.splice(randIdx, 1));
    }
    selectedSongs = [];
    draftPickerIndex = 0; 
    renderDraftScreen();
}

function renderDraftScreen() {
    const activePlayer = gameConfig.players[draftPickerIndex];
    document.getElementById("gameStatusTitle").innerText = `【選曲フェーズ】${activePlayer.name}さん 曲を選んでください (${selectedSongs.length + 1}/${totalSongsToPlay}曲目)`;
    let html = `<p style='text-align:center;'>必要な合計曲数: ${totalSongsToPlay}曲 / 現在選ばれた曲数: ${selectedSongs.length}曲</p><div class='song-pool'>`;
    drawnSongs.forEach((song, idx) => {
        html += `<div class="song-card" onclick="selectDraftSong(${idx})"><span class="badge">[${song.rank}]</span><br>${song.name}</div>`;
    });
    html += `</div>`;
    document.getElementById("selectionArea").innerHTML = html;
    document.getElementById("matchPlayArea").innerHTML = "";
    document.getElementById("actionBtn").style.display = "none";
}

function selectDraftSong(idx) {
    const song = drawnSongs.splice(idx, 1);
    selectedSongs.push(song);
    if(selectedSongs.length < totalSongsToPlay) {
        draftPickerIndex = (draftPickerIndex + 1) % gameConfig.players.length;
        renderDraftScreen();
    } else {
        currentRound = 0;
        document.getElementById("selectionArea").innerHTML = "";
        initMatchProgress();
    }
}

function initNormalMode() {
    selectedSongs = [];
    drawNextNormalSong();
}

function drawNextNormalSong() {
    const randIdx = Math.floor(Math.random() * filteredSongs.length);
    selectedSongs.push(filteredSongs[randIdx]);
    initMatchProgress();
}

function initMatchProgress() {
    const currentSong = selectedSongs[currentRound];
    document.getElementById("gameStatusTitle").innerText = `第 ${currentRound + 1} / ${totalSongsToPlay} 楽曲：${currentSong.name} [${currentSong.rank}]`;
    let html = `<div class="match-block"> <div class="player-input-row header-row"> <div>プレイヤー名</div> <div>最大コンボ</div> <div>良の数</div> <div>可の数</div> <div>不可の数</div> </div>`;
    gameConfig.players.forEach((player, idx) => {
        html += `<div class="player-input-row"> <div style="font-weight:bold;">${player.name}</div> <div><input type="number" id="combo_${idx}" value="700" min="1"></div> <div><input type="number" id="ryo_${idx}" value="680" min="0"></div> <div><input type="number" id="ka_${idx}" value="20" min="0"></div> <div><input type="number" id="fuka_${idx}" value="0" min="0"></div> </div>`;
    });
    html += `</div>`;
    document.getElementById("matchPlayArea").innerHTML = html;
    const btn = document.getElementById("actionBtn");
    btn.style.display = "block";
    btn.innerText = (currentRound === totalSongsToPlay - 1) ? "すべての結果を計算してリザルトへ" : "スコアを記録して次の曲へ";
}

function handleGameAction() {
    for(let i=0; i<gameConfig.players.length; i++) {
        const combo = parseInt(document.getElementById(`combo_${i}`).value) || 1;
        const ryo = parseInt(document.getElementById(`ryo_${i}`).value) || 0;
        const ka = parseInt(document.getElementById(`ka_${i}`).value) || 0;
        const fuka = parseInt(document.getElementById(`fuka_${i}`).value) || 0;
        gameConfig.players[i].results.push({
            songName: selectedSongs[currentRound].name,
            maxCombo: combo,
            ryo: ryo,
            ka: ka,
            fuka: fuka
        });
    }
    currentRound++;
    if(currentRound < totalSongsToPlay) {
        if(gameConfig.selectionMethod === 'normal') {
            drawNextNormalSong();
        } else {
            initMatchProgress();
        }
    } else {
        showFinalResults();
    }
}

function showFinalResults() {
    document.getElementById("gameStatusTitle").innerText = "🏆 最終リザルト発表 🏆";
    document.getElementById("selectionArea").innerHTML = "";
    let scoredPlayers = gameConfig.players.map(player => {
        let totalRatioSum = 0, totalPenaltyPoints = 0;
        let totalRyo = 0, totalKa = 0, totalFuka = 0;
        player.results.forEach(res => {
            totalRatioSum += (res.ryo / res.maxCombo) * 100;
            totalPenaltyPoints += (res.ka * 1) + (res.fuka * 2);
            totalRyo += res.ryo;
            totalKa += res.ka;
            totalFuka += res.fuka;
        });
        const finalScoreValue = (gameConfig.scoringRule === 'ratio') ? (totalRatioSum).toFixed(2) : totalPenaltyPoints;
        return {
            name: player.name,
            finalScoreValue: parseFloat(finalScoreValue),
            totalRyo: totalRyo,
            totalKa: totalKa,
            totalFuka: totalFuka,
            displayScore: (gameConfig.scoringRule === 'ratio') ? `${finalScoreValue}%` : `${finalScoreValue} pt (減点)`
        };
    });

    if (gameConfig.scoringRule === 'ratio') {
        scoredPlayers.sort((a, b) => b.finalScoreValue - a.finalScoreValue);
    } else {
        scoredPlayers.sort((a, b) => a.finalScoreValue - b.finalScoreValue);
    }

    let html = `
        <table class="result-table">
            <thead>
                <tr>
                    <th>順位</th>
                    <th>プレイヤー名</th>
                    <th>判定基準スコア</th>
                    <th>総良</th>
                    <th>総可</th>
                    <th>総不可</th>
                </tr>
            </thead>
            <tbody>
    `;

    scoredPlayers.forEach((p, idx) => {
        html += `
            <tr class="rank-${idx + 1}">
                <td>${idx + 1}位</td>
                <td>${p.name}</td>
                <td>${p.displayScore}</td>
                <td>${p.totalRyo}</td>
                <td>${p.totalKa}</td>
                <td>${p.totalFuka}</td>
            </tr>
        `;
    });

    html += `
            </tbody>
        </table>
        <button class="btn btn-accent" onclick="location.reload()">もう一度遊ぶ</button>
    `;

    document.getElementById("matchPlayArea").innerHTML = html;
    document.getElementById("actionBtn").style.display = "none";
}
